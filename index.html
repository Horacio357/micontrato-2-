<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />

    <!-- Viewport: iOS safe area + prevent zoom on inputs -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5.0" />

    <!-- Primary Meta -->
    <title>micontrato — Contratos legales en minutos</title>
    <meta name="description" content="Creá contratos legales personalizados para Argentina en minutos. Inmobiliarios, laborales, comerciales y civiles. Firma digital incluida." />
    <meta name="keywords" content="contratos legales Argentina, contrato de alquiler, contrato laboral, firma digital, documentos legales" />
    <meta name="author" content="micontrato" />
    <meta name="theme-color" content="#15294b" />
    <meta name="color-scheme" content="light dark" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="micontrato" />

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="micontrato — Contratos legales en minutos" />
    <meta property="og:description" content="Creá contratos legales personalizados para Argentina en minutos. Firma digital incluida." />
    <meta property="og:locale" content="es_AR" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="micontrato — Contratos legales en minutos" />
    <meta name="twitter:description" content="Creá contratos legales personalizados para Argentina en minutos." />

    <!-- Preconnect / DNS-prefetch for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://api.base44.com" />
    <link rel="preconnect" href="https://api.base44.com" crossorigin />

    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "micontrato",
      "description": "Plataforma de generación de contratos legales para Argentina",
      "applicationCategory": "LegalService",
      "operatingSystem": "Any",
      "offers": {
        "@type": "Offer",
        "priceCurrency": "ARS"
      }
    }
    </script>

    <!-- Pre-boot error trap: previene pantallas en blanco ante fallos de carga o scripts -->
    <script>
      window.addEventListener('error', function(event) {
        var root = document.getElementById('root');
        if (root && (!root.childNodes || root.childNodes.length === 0)) {
          var msg = event.message || (event.error ? event.error.message : 'Error al cargar recursos');
          root.innerHTML = '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:#f8fafc;font-family:system-ui,sans-serif;">' +
            '<div style="max-width:480px;width:100%;background:#fff;padding:32px;border-radius:16px;box-shadow:0 4px 20px rgba(0,0,0,0.08);border:1px solid #fee2e2;text-align:center;">' +
              '<h2 style="font-size:18px;font-weight:700;color:#991b1b;margin-top:0;margin-bottom:8px;">No se pudo iniciar la aplicación</h2>' +
              '<p style="font-size:14px;color:#7f1d1d;margin-bottom:20px;">' + msg + '</p>' +
              '<p style="font-size:13px;color:#64748b;margin-bottom:20px;">Esto puede ocurrir si tu navegador tiene una versión anterior guardada en caché.</p>' +
              '<button onclick="try{localStorage.clear();sessionStorage.clear();}catch(e){}if(navigator.serviceWorker){navigator.serviceWorker.getRegistrations().then(function(regs){regs.forEach(function(r){r.unregister()});location.reload(true);}).catch(function(){location.reload(true);});}else{location.reload(true);}" style="width:100%;padding:12px;background:#15294b;color:#fff;border-radius:10px;font-weight:600;border:none;cursor:pointer;">Limpiar caché y reintentar</button>' +
            '</div>' +
          '</div>';
        }
      }, true);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
